name: 🍎 iOS Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  build-and-submit-ios:
    name: Build iOS & Submit to TestFlight
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 💎 Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: 🪵 Install CocoaPods and Fastlane
        run: gem install cocoapods fastlane

      - name: 📥 Install Node dependencies
        run: npm ci

      - name: 📋 Validate and Fix Dependencies
        run: npx expo install --check --fix || npx expo install

      - name: 🛠️ Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔑 Decode App Store Connect API Key
        run: |
          mkdir -p /tmp/asc
          echo "${{ secrets.ASC_API_KEY_CONTENT }}" | base64 --decode > /tmp/asc/AuthKey.p8

      - name: 🔨 Build iOS locally (EAS manages signing credentials)
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output ${{ github.workspace }}/build/app.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🌐 Upload .ipa to Temporary Link
        run: |
          echo "Uploading .ipa so you can download it..."
          curl bashupload.com -T ${{ github.workspace }}/build/app.ipa

      - name: 📤 Submit to TestFlight via API Key
        run: |
          eas submit \
            --platform ios \
            --path ${{ github.workspace }}/build/app.ipa \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}


