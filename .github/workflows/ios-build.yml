name: 🍎 iOS Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  build-and-submit-ios:
    name: Build iOS & Submit to TestFlight
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 💎 Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: 🪵 Install CocoaPods
        run: sudo gem install cocoapods

      - name: 📥 Install Node dependencies
        run: npm ci

      - name: 🛠️ Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔨 Build iOS locally (using EAS for credentials)
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output ${{ github.workspace }}/build/app.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Submit to TestFlight
        run: |
          eas submit \
            --platform ios \
            --path ${{ github.workspace }}/build/app.ipa \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: 📁 Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ios-${{ github.run_number }}.ipa
          path: ${{ github.workspace }}/build/app.ipa
          retention-days: 7
